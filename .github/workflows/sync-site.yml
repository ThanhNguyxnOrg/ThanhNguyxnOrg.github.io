name: Sync site data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Bake data
        run: node scripts/sync.ts --out src/data/baked.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit on change
        run: |
          git diff --quiet src/data/baked.json && echo "no change" && exit 0
          git config user.name "tnorg-sync[bot]"
          git config user.email "tnorg-sync[bot]@users.noreply.github.com"
          git add src/data/baked.json
          git commit -m "chore: baked data $(date -u +%F)"
          git push
