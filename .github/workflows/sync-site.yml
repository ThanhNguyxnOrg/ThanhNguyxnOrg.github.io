name: Sync site data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-site-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Normalize brand assets
        run: npm run brand:sync
      - name: Bake data
        run: node scripts/sync.ts --out src/data/baked.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and build
        run: npm run build && npm test && node scripts/check-dist.mjs
      - name: Commit on change
        run: |
          git add -A src/data/baked.json public/logos public/brand
          git diff --cached --quiet && echo "no change" && exit 0
          git config user.name "thanhnguyxnagent[bot]"
          git config user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git commit -m "chore: sync site data and brand assets $(date -u +%F)"
          git push
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
