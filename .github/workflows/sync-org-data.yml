name: Sync telemetry and deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [org-repo-updated, release-published]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: org-telemetry-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@agent-v1
        with:
          profile: content
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}


      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.agent-token.outputs.token }}

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize brand assets
        run: npm run brand:sync

      - name: Bake live GitHub and npm telemetry
        env:
          GITHUB_TOKEN: ${{ steps.agent-token.outputs.token }}
        run: npm run sync

      - name: Test and type-check
        run: npm test && npm run lint

      # NOTE: synced telemetry and brand assets are intentionally NOT
      # committed. The sync steps above regenerate them in-runner and
      # the build below bakes them into the deployed bundle, so the
      # live site is always fresh without a commit per run. The
      # previously committed src/data/liveSnapshot.json stays in the
      # repo as the offline fallback for local builds.

      - name: Build production bundle
        run: npm run build

      # Include the attempt number so a retry never collides with an
      # artifact uploaded by an earlier attempt of the same workflow run.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
