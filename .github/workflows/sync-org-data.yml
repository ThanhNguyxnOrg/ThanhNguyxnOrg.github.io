name: Sync telemetry and deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [org-repo-updated, release-published]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: org-telemetry-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create ThanhNguyxnAGent App token
        id: agent-token
        if: ${{ vars.THANHNGUYN_AGENT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.THANHNGUYN_AGENT_APP_ID }}
          private-key: ${{ secrets.THANHNGUYN_AGENT_PRIVATE_KEY }}
          owner: ThanhNguyxnOrg
          repositories: ThanhNguyxnOrg.github.io

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.agent-token.outputs.token || github.token }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize brand assets
        run: npm run brand:sync

      - name: Bake live GitHub and npm telemetry
        env:
          GITHUB_TOKEN: ${{ steps.agent-token.outputs.token || github.token }}
        run: npm run sync

      - name: Test and type-check
        run: npm test && npm run lint

      - name: Commit synced data
        run: |
          git add -A src/data/liveSnapshot.json public/logos public/brand
          if git diff --cached --quiet; then
            echo "No synced data changes"
            exit 0
          fi
          git config user.name "ThanhNguyxnAGent[bot]"
          git config user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git commit -m "chore(sync): update live telemetry and brand assets [skip ci]"
          git push

      - name: Build production bundle
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
