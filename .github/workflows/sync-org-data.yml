name: Sync telemetry and deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [org-repo-updated, release-published]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: org-telemetry-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}


      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.agent-token.outputs.token }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize brand assets
        run: npm run brand:sync

      - name: Bake live GitHub and npm telemetry
        env:
          GITHUB_TOKEN: ${{ steps.agent-token.outputs.token }}
        run: npm run sync

      - name: Test and type-check
        run: npm test && npm run lint

      - name: Set ThanhNguyxnAgent commit identity
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-git-identity@da9d02544f60aeec92f8c851846ee3a587044beb

      - name: Commit synced data
        run: |
          git add -A src/data/liveSnapshot.json public/logos public/brand
          if git diff --cached --quiet; then
            echo "No synced data changes"
            exit 0
          fi
          git commit -m "chore(sync): update live telemetry and brand assets [skip ci]"
          git push

      - name: Build production bundle
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
