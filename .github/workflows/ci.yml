name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@487331d8d32ef5847ac1e53935681669cf56e331
    with:
      job_name: Verify (Website)
      node_version: "22"
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      validation_command: npm run brand:check
      lint_command: npm run lint
      test_command: npm test
      build_command: npm run build
      post_build_command: test -s dist/index.html
      timeout_minutes: 25
